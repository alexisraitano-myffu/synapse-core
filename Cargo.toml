[workspace]
resolver = "2"
members = [
    "crates/synapse-core",
    "crates/synapse-core-py",
    "crates/synapse-core-ffi",
]
# synapse-core-py links against libpython symbols resolved at import time and
# must be built through maturin (which passes -undefined dynamic_lookup).
default-members = [
    "crates/synapse-core",
    "crates/synapse-core-ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/alexisraitano-myffu/synapse-core"

[workspace.dependencies]
synapse-core = { path = "crates/synapse-core" }
fastembed = { version = "5.17", default-features = false }
# Already in the tree via fastembed; used directly for SYN-118 chunk windowing.
# Les features doivent rester le MIROIR EXACT de celles que fastembed declare
# (`default-features = false, features = ["onig"]`) : l'unification des features
# de Cargo est additive, donc une declaration plus large ici rallume les
# features pour fastembed aussi. Les defauts de tokenizers tirent `esaxx_fast`
# => `esaxx-rs/cpp`, un objet C++ compile en CRT statique (/MT) qui n'entre en
# jeu que pour l'ENTRAINEMENT BPE (on ne fait que de l'inference) et qui refuse
# de linker avec le binaire ONNX Runtime prebuilt de ort-sys, en /MD
# (LNK2038 sur windows-latest depuis MSVC 14.51). Voir SYN-147.
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
# bundled: the same SQLite compiled into the core on every platform (macOS,
# Android, iOS), instead of whatever the OS ships.
rusqlite = { version = "0.40", features = ["bundled", "load_extension"] }
# Hard pin to the exact version the Python backend loads (pip sqlite-vec
# 0.1.9): both sides touch the same vec0 tables during the migration.
# (0.1.10-alpha.4 also ships a broken crate tarball: missing diskann source.)
sqlite-vec = { version = "=0.1.9" }

[profile.release]
lto = true
strip = true
